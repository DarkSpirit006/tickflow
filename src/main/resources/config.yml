enabled: true

# Timing limits
minimum-tps-for-compensation: 1.0
max-compensation-ticks-per-server-tick: 4
max-compensation-multiplier: 3.0
max-tick-debt: 80.0

# Compensation features
world-time-acceleration: true
random-tickspeed-acceleration: true
pickup-acceleration: false
mob-timer-acceleration: false
potion-effect-duration-acceleration: false
tnt-acceleration: false

# Safety
respect-other-random-tick-changes: true
max-entity-updates-per-tick: 2000
protect-world-generation: true
worldgen-protection-tps: 12.0
worldgen-protection-exit-tps: 14.0
worldgen-protection-window-ms: 3000

# Diagnostics
log-unsupported-features: true
log-version-detection: true
diagnostics-enabled: false
diagnostics-sample-interval-ticks: 20
