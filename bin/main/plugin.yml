name: TickFlow
version: '${version}'
main: dev.tickflow.plugin.TickFlowPlugin
description: Real-time tick compensation for Minecraft servers.
author: DarkSpirit006
website: https://github.com/DarkSpirit006/tickflow
api-version: '26.2'
load: POSTWORLD
commands:
  tickflow:
    description: View and control TickFlow.
    usage: /tickflow <tps|status|toggle|bossbar|log|reload>
    permission: tickflow.admin
    aliases: [tf]
permissions:
  tickflow.admin:
    description: Manage TickFlow.
    default: op
